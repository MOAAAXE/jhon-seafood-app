name: jhon_seafood_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.5
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  mobile_scanner: ^7.4.0
  fl_chart: ^1.2.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - asset/logo.png